<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishna Patel - Portfolio</title>
    <link rel="icon" type="image/png" href="kp_logo.png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            // EmailJS initialization
            emailjs.init('CG2RVtLOfKNQzt-rK');
        })();
    </script>
</head>

<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-content">
            <div class="logo">
                <img src="kp_logo.png" alt="KP Logo">
            </div>

            <!-- Mobile Menu Button -->
            <button class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Navigation Container -->
            <div class="nav-container">
                <div class="nav-icons-container">
                    <ul class="nav-links">
                        <li>
                            <a href="#home" title="Home">
                                <i class="fas fa-home"></i>
                                <span class="nav-text">Home</span>
                            </a>
                        </li>
                        <li>
                            <a href="#skills" title="Skills">
                                <i class="fas fa-code"></i>
                                <span class="nav-text">Skills</span>
                            </a>
                        </li>
                        <li>
                            <a href="#experience" title="Experience">
                                <i class="fas fa-briefcase"></i>
                                <span class="nav-text">Experience</span>
                            </a>
                        </li>
                        <li>
                            <a href="#projects" title="Projects">
                                <i class="fas fa-project-diagram"></i>
                                <span class="nav-text">Projects</span>
                            </a>
                        </li>
                        <li>
                            <a href="#contact" title="Contact">
                                <i class="fas fa-envelope"></i>
                                <span class="nav-text">Contact</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Theme Controls -->
    <div class="theme-controls">
        <div class="theme-switcher">
            <button class="theme-toggle">
                <i class="fas fa-palette"></i>
            </button>
            <div class="color-options">
                <div class="color-option" data-color="#ec4899" title="Pink"></div>
                <div class="color-option" data-color="#f97316" title="Orange"></div>
                <div class="color-option" data-color="#8b5cf6" title="Purple"></div>
                <div class="color-option" data-color="#10b981" title="Green"></div>
                <div class="color-option" data-color="#d946ef" title="Magenta"></div>
                <div class="color-option" data-color="#ef4444" title="Red"></div>
            </div>
        </div>
        <button class="dark-mode-toggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <!-- Main Content -->
    <main>
        <!-- Home Section -->
        <section id="home" class="section">
            <div class="animated-background">
                <!-- Frontend Skills -->
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg" alt="HTML5">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg" alt="CSS3">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg"
                    alt="JavaScript">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg" alt="React">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/angularjs/angularjs-original.svg"
                    alt="Angular">

                <!-- Backend Skills -->
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/java/java-original.svg" alt="Java">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/spring/spring-original.svg" alt="Spring">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/nodejs/nodejs-original.svg" alt="Node.js">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" alt="Python">

                <!-- Cloud Skills -->
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/amazonwebservices/amazonwebservices-plain-wordmark.svg"
                    alt="AWS">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/googlecloud/googlecloud-original.svg" alt="GCP">

                <!-- DevOps Skills -->
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/jenkins/jenkins-original.svg" alt="Jenkins">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg" alt="GitHub">
                <img class="floating-skill"
                    src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/docker/docker-original.svg" alt="Docker">
            </div>
            <div class="home-content">
                <h1 class="home-title"> Krishna Patel </h1>
                <div class="typewriter">
                    <span class="static-text">I'm&nbsp;&nbsp;</span>
                    <span class="typing-text"> </span>
                    <span class="cursor"></span>
                    <span class="period">.</span>
                </div>
            </div>
        </section>

        <!-- Skills Section -->
        <section id="skills" class="section">
            <div class="section-content">
                <h2 class="section-title">Skills</h2>

                <!-- Skills Category Tabs -->
                <div class="skills-tabs">
                    <button class="skill-tab active" data-category="frontend">
                        <i class="fas fa-laptop-code"></i>
                        <span>Frontend</span>
                    </button>
                    <button class="skill-tab" data-category="backend">
                        <i class="fas fa-server"></i>
                        <span>Backend</span>
                    </button>
                    <button class="skill-tab" data-category="cloud">
                        <i class="fas fa-cloud"></i>
                        <span>Cloud</span>
                    </button>
                    <button class="skill-tab" data-category="devops">
                        <i class="fas fa-cogs"></i>
                        <span>DevOps</span>
                    </button>
                </div>

                <!-- Skills Cards Container - Populated dynamically from data/skills.json -->
                <div class="skills-cards-container">
                    <div class="skills-card-grid active" data-category="frontend"></div>
                    <div class="skills-card-grid" data-category="backend"></div>
                    <div class="skills-card-grid" data-category="cloud"></div>
                    <div class="skills-card-grid" data-category="devops"></div>
                </div>
            </div>
        </section>

        <!-- Experience Section - Populated dynamically from data/experience.json -->
        <section id="experience" class="section">
            <div class="section-content">
                <h2 class="section-title">Experience</h2>
                <div class="timeline">
                    <!-- Timeline cards will be loaded dynamically -->
                </div>
            </div>
        </section>

        <!-- Projects Section - Populated dynamically from data/projects.json -->
        <section id="projects" class="section">
            <h2>Projects</h2>
            <div class="projects-grid">
                <!-- Project cards will be loaded dynamically -->
            </div>
        </section>

        <!-- Contact Section -->
        <section id="contact" class="section">
            <div class="section-content">
                <h2 class="section-title">Contact Me</h2>
                <div class="contact-container">
                    <div class="contact-info">
                        <div class="contact-item">
                            <i class="fas fa-envelope"></i>
                            <span>Email: </span>
                            <a href="mailto:ikrishnapatel@krishnapatel.com"
                                class="contact-link">ikrishnapatel@gmail.com</a>
                        </div>
                        <div class="contact-item">
                            <i class="fas fa-phone"></i>
                            <span>Phone: </span>
                            <a href="tel:+91 877-022-5685" class="contact-link">+91 877-022-5685</a>
                        </div>
                        <div class="contact-social">
                            <a href="#" class="social-link" title="LinkedIn">
                                <i class="fab fa-linkedin"></i>
                            </a>
                            <a href="#" class="social-link" title="GitHub">
                                <i class="fab fa-github"></i>
                            </a>
                        </div>
                    </div>
                    <form id="contactForm" class="contact-form" onsubmit="return sendEmail(event)">
                        <div class="form-group">
                            <label for="name">Name *</label>
                            <input type="text" id="name" name="name" required pattern="^[a-zA-Z\s]{2,50}$"
                                title="Please enter a valid name (2-50 characters, letters only)" maxlength="50">
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="email">Email *</label>
                            <input type="email" id="email" name="email" required
                                pattern="[a-zA-Z0-9._+4-]+@[a-zA-Z0-9.-]+\\.[a-zA-Z]{2,}"
                                title="Please enter a valid email address">
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone *</label>
                            <input type="tel" id="phone" name="phone" required pattern="^\+?[1-9][0-9]{7,14}$"
                                title="Please enter a valid phone number" maxlength="15">
                            <span class="error-message"></span>
                        </div>
                        <div class="form-group">
                            <label for="message">Message *</label>
                            <textarea id="message" name="message" required minlength="10" maxlength="500"
                                title="Please enter a message (10-500 characters)"></textarea>
                            <span class="error-message"></span>
                            <div class="char-count">0/500</div>
                        </div>
                        <div class="form-group">
                            <button type="submit" class="submit-btn" id="submitBtn">
                                <span>Send Message</span>
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-content">
                <div class="copyright">
                    <p>&copy; <span id="current-year"></span> Krishna Patel. All rights reserved.</p>
                </div>
                <div class="footer-social">
                    <a href="#" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
                    <a href="#" title="Twitter"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </footer>

        <script src="script.js"></script>
</body>

</html>
